name: Keep backend warm

# Render's free-tier web service sleeps after ~15 min of inactivity. A cold
# start has to chain JVM boot -> Spring context -> Flyway validate -> Hikari
# connecting to Neon (which also autosuspends and has its own wake delay), so
# a single 90s attempt can time out before the app ever answers. Retrying with
# a generous per-attempt timeout lets a slow cold start actually complete
# instead of registering as a failed ping that warmed nothing.
#
# Note: GitHub's own scheduler is best-effort for `cron` triggers - on quiet
# repos it commonly delays or skips runs by 30min-2h+, so this alone does not
# guarantee true 10-minute cadence. Pair with an external cron pinger (e.g.
# cron-job.org or UptimeRobot) for reliable timing.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health
        run: |
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 60 \
            https://volare-backend.onrender.com/actuator/health
          echo
          echo "Backend is awake."
