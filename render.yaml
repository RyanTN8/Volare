# Render Blueprint — deploys the Volare backend + managed Postgres.
# Render reads this automatically when you create a "Blueprint" from the repo.
services:
  - type: web
    name: volare-backend
    runtime: docker
    dockerfilePath: ./volare-backend/Dockerfile
    dockerContext: ./volare-backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon Postgres — set these in the Render dashboard (sync: false keeps them out of git).
      # Neon requires sslmode=require; the app defaults DB_SSLMODE to "disable" if unset.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        sync: false
      # Secrets — set these in the Render dashboard (sync: false keeps them out of git)
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
