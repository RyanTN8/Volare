# Render Blueprint — deploys the Volare backend + managed Postgres.
# Render reads this automatically when you create a "Blueprint" from the repo.
services:
  - type: web
    name: volare-backend
    runtime: docker
    dockerfilePath: ./volare-backend/Dockerfile
    dockerContext: ./volare-backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: volare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: volare-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: volare-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: volare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: volare-db
          property: password
      # Secrets — set these in the Render dashboard (sync: false keeps them out of git)
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: volare-db
    plan: free
    region: oregon
