version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: volare-db
    environment:
      POSTGRES_DB: volare
      POSTGRES_USER: volare
      POSTGRES_PASSWORD: volare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volare"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./volare-backend
      dockerfile: Dockerfile
    container_name: volare-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: volare
      DB_USERNAME: volare
      DB_PASSWORD: volare
      FOURSQUARE_API_KEY: ${FOURSQUARE_API_KEY:-}
      DUFFEL_API_TOKEN: ${DUFFEL_API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./volare-frontend
      dockerfile: Dockerfile
    container_name: volare-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8080

volumes:
  postgres_data:
