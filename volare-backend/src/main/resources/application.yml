spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:volare}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:volare}
    password: ${DB_PASSWORD:volare}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

foursquare:
  api-key: ${FOURSQUARE_API_KEY:}
  base-url: https://places-api.foursquare.com
  api-version: "2025-06-17"
  cache-ttl-seconds: 300
  timeout-seconds: 10

duffel:
  api-token: ${DUFFEL_API_TOKEN:}
  base-url: https://api.duffel.com
  timeout-seconds: 15

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  # gemini-2.0-flash has zero free-tier quota on the current key's project;
  # gemini-2.5-flash works on the free tier.
  model: gemini-2.5-flash
  timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    instances:
      foursquare:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: count_based
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
      duffel:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
      gemini:
        register-health-indicator: true
        sliding-window-size: 5
        minimum-number-of-calls: 3
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 60
  retry:
    instances:
      foursquare:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientException
      duffel:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      gemini:
        max-attempts: 2
        wait-duration: 2s

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%logger{36}","message":"%msg"}%n'
  level:
    com.volare: DEBUG
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false

logging:
  level:
    com.volare: INFO
